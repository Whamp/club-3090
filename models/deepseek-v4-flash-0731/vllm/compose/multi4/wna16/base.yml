# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4-Flash-0731 projection-sensitive WNA16 quality quant
#   Topology:  Four RTX 3090 PCIe (TP=4, no NVLink)
#   Runtime:   Whamp/vLLM b7766cfe4, FP8 Marlin wo_a diagonal projection
#   Drafter:   none — MTP permanently omitted from this artifact
#   KV:        fp8_ds_mla (DeepSeek UE8M0 packed cache)
#   Vision:    no
#   Max ctx:   230,144 tokens; max_num_seqs=2; 275,238 aggregate cache tokens
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🧪 Experimental — accepted server60 speed/capacity profile
#   Measured:  server60 4x RTX 3090, 2026-08-15: 74.98 decode tok/s mean,
#              887.52 cache-busted prefill tok/s at ~9K tokens, exact recall at
#              211,551 tokens; prior capacity validation covered 2x90,029.
#   Correctness: basic, automatic-tool, tool-response prefill, multi-turn agent,
#                coding, 7,726-token reasoning, and long-context probes passed.
#   Best for:  One long request through 230K, or two requests within the
#              measured 275K-token aggregate KV capacity.
# ---------------------------------------------------------------------------
# FAILED PRODUCTION GATE — DO NOT OMIT: after the 211,551-token stress fill,
# only 93 MiB physical VRAM remained per card versus verify-stress.sh's 1 GiB
# sustained-agent advisory threshold. The service stayed healthy and zero-swap,
# and rank 0 retained ~437 MiB of reclaimable Torch allocator cache, but this is
# a measured capacity ceiling rather than a generous-headroom profile.
#
# Other limits: local custom image; no CPU weight offload; vLLM's legacy custom
# all-reduce disabled. The measured hierarchical backend uses PCIe islands
# [[0,1],[2,3]]. KV offloading has a 16 GiB host tier for eviction beyond the
# on-GPU pool; it is not part of the measured 230K performance path.
# Two-request validation covered 2x90K, not two simultaneous 230K
# requests. Plain `docker compose up` starts nothing. The authorized profile is
# explicit because this service occupies all four GPUs. MODEL_SNAPSHOT must be
# immutable artifact revision 12035985bf555d0ddc603c6305586a8fa915589c;
# the image-owned materializer verifies its config and index before launch.
# ===========================================================================
services:
  deepseek-v4-wna16-sm86:
    profiles: [authorized-gpu-test]
    image: ${VLLM_IMAGE:-club-3090/deepseek-v4-wna16-sm86:quality-12035985-speed-b7766cfe@sha256:eb2884fc60ee332d7adb9d5e424e35acf8817dad0f93c8bb7ea7095cb8f58a0e}
    container_name: ${CONTAINER_NAME:-vllm-deepseek-v4-wna16-sm86}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8034}:8000"
    volumes:
      - ${MODEL_SNAPSHOT:?set MODEL_SNAPSHOT to immutable artifact snapshot}:/artifact:ro
      - ${MODEL_BLOBS:?set MODEL_BLOBS to artifact blob directory}:/blobs:ro
      - ${RUNTIME_CACHE_ROOT:?set RUNTIME_CACHE_ROOT}/humming:/root/.cache/humming
      - ${RUNTIME_CACHE_ROOT:?set RUNTIME_CACHE_ROOT}/triton:/root/.triton/cache
      - ${RUNTIME_CACHE_ROOT:?set RUNTIME_CACHE_ROOT}/torch_extensions:/root/.cache/torch_extensions
    tmpfs:
      - /runtime-model:size=16m,mode=0755
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      VLLM_NO_USAGE_STATS: 1
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      NCCL_CUMEM_ENABLE: 0
      OMP_NUM_THREADS: 1
      HUMMING_CACHE_DIR: /root/.cache/humming
      HUMMING_COMPILER: nvrtc
      TRITON_CACHE_DIR: /root/.triton/cache
      TORCH_EXTENSIONS_DIR: /root/.cache/torch_extensions
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: 64
      VLLM_SPARSE_DENSE_QUERY_BLOCK: 0
      VLLM_DSV4_WO_A_MARLIN_DIAGONAL: 1
      VLLM_DSV4_FLASH_MLA_DECODE: 1
      VLLM_HIER_ALL_REDUCE: "0,1;2,3"
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    command:
      - --model
      - /runtime-model
      - --served-model-name
      - deepseek-v4-flash-0731-wna16-quality-12035985
      - --tensor-parallel-size
      - "4"
      - --max-model-len
      - "${MAX_MODEL_LEN:-230144}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.98}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-2}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-256}"
      - --kv-cache-dtype
      - fp8_ds_mla
      - --kv-offloading-size
      - "${KV_OFFLOADING_SIZE:-16}"
      - --disable-custom-all-reduce
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
