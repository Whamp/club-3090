supported_drafters: []
supported_weight_formats:
  - gguf
required_overlays: []
vendored_overlays: []
required_genesis: false
notes: >-
  Canonical DeepSeek V4 Flash llama.cpp engine; it remains separately named and
  does not replace llama-cpp-local for other model families. The base is alesha-pro/ds4-longctx at b001c8cd7,
  which adds stable-topology CUDA graphs, resident-MoE scheduling, sparse
  attention, and the other DSV4_* fast-prefill paths. Whamp commit 0379cf4bf
  repairs that fork's Q8 KV path: packed quantized concat, CUDA-native Q8
  padding, and type-preserving long-context gathers, with Q8 concat regression
  tests. Validated only on 4x RTX 3090 sm_86 with Antirez IQ2_XXS, matching Q8 K/V,
  LLAMA_ATTN_ROT_DISABLE=1, and fixed 230 W/card. The image is compiled for sm_86.
  The external dependency and rotation-disabled Q8 path remain explicit
  operational constraints; replace this engine only after an equivalent
  mainline path passes the same depth, quality, and soak gates.
