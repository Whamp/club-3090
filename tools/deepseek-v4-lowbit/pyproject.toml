[project]
name = "deepseek-v4-lowbit"
version = "0.1.0"
description = "Plan and build mixed-WNA16 DeepSeek V4 artifacts"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
deepseek-v4-convert = "deepseek_v4_lowbit.convert_cli:main"
deepseek-v4-pilot = "deepseek_v4_lowbit.pilot_cli:main"
deepseek-v4-summarize-pilot = "deepseek_v4_lowbit.pilot_report_summary:main"
deepseek-v4-validate-pilot = "deepseek_v4_lowbit.pilot_handoff:main"
deepseek-v4-verify-upload = "deepseek_v4_lowbit.artifact_upload_verifier:main"
deepseek-v4-plan = "deepseek_v4_lowbit.plan_cli:main"
deepseek-v4-capture-source-headers = "deepseek_v4_lowbit.source_headers_cli:main"
deepseek-v4-screen-frontier = "deepseek_v4_lowbit.frontier_screen_cli:main"
deepseek-v4-run-frontier-screen = "deepseek_v4_lowbit.frontier_campaign_cli:main"
deepseek-v4-build-frontier-recipes = "deepseek_v4_lowbit.frontier_recipe_cli:main"
deepseek-v4-select-frontier-boundaries = "deepseek_v4_lowbit.frontier_boundary_cli:main"
deepseek-v4-screen-frontier-full = "deepseek_v4_lowbit.frontier_full_screen_cli:main"
deepseek-v4-convert-frontier = "deepseek_v4_lowbit.frontier_convert_cli:main"
deepseek-v4-run-frontier-batch = "deepseek_v4_lowbit.frontier_batch_cli:main"
deepseek-v4-publish-frontier = "deepseek_v4_lowbit.frontier_publish_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"
