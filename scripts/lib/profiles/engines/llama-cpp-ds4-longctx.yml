schema_version: 1
id: llama-cpp-ds4-longctx
display_name: alesha-pro llama.cpp DeepSeek V4 long-context fork (Q8 repair)
type: llama.cpp
stability: stable
install:
  method: docker_image
  # Digest-pinned public image. Built from the exact validated runtime commit
  # named in feature_provenance; the tag is only a human-readable alias.
  spec: ghcr.io/whamp/llama-cpp-ds4-longctx@sha256:a96bd947d63eb81d8baf9f6f5ecb26669476383976717237450fbb5727b03745
min_sm: 8.6
supported_model_families:
  - deepseek4-moe
features:
  deepseek4_q8_kv: true
  dsv4_prefill_graphs: true
feature_provenance:
  deepseek4_q8_kv: https://github.com/Whamp/llama.cpp/commit/0379cf4bf889f3d28038a005210c4bc193fc8ba1
  dsv4_prefill_graphs: https://github.com/alesha-pro/llama.cpp/tree/ds4-longctx
supported_kv_formats:
