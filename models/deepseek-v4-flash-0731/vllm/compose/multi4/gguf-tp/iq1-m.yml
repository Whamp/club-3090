# Experimental native Unsloth UD-IQ1_M GGUF-TP profile for server60.
# Initial gate only: 148K context, FP8 DS-MLA KV, max_num_seqs=2.
# Do not promote until TP=4 correctness, quality, NIAH, performance, VRAM,
# and zero-swap gates in IQ1-MANIFEST.json have passed.
services:
  deepseek-v4-gguf-tp-sm86:
    image: club-3090/deepseek-v4-gguf-tp@sha256:d613e0f71d7c95dfc9832d5207b5cb7f44d703837cd407479272bb1f1d21bc39
    container_name: "${ESTATE_CONTAINER:-dsv4-gguf-tp-iq1m}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8034}:8000"
    volumes:
      - /home/will/inference/runtime/gguf-tp-iq1/model-view-iq1-m:/runtime-model:ro
      - /home/will/models/deepseek-v4-frontier-quality-cache/hub/models--hampsonw--DeepSeek-V4-Flash-0731-WNA16/blobs:/blobs:ro
      - /mnt/models/huggingface/hub/models--unsloth--DeepSeek-V4-Flash-0731-GGUF/snapshots/109848da2469efe1f1aab9e11acea08a065ccd4f/UD-IQ1_M/DeepSeek-V4-Flash-0731-UD-IQ1_M-00001-of-00003.gguf:/model-00001.gguf:ro
      - /mnt/models/huggingface/hub/models--unsloth--DeepSeek-V4-Flash-0731-GGUF/snapshots/109848da2469efe1f1aab9e11acea08a065ccd4f/UD-IQ1_M/DeepSeek-V4-Flash-0731-UD-IQ1_M-00002-of-00003.gguf:/model-00002.gguf:ro
      - /mnt/models/huggingface/hub/models--unsloth--DeepSeek-V4-Flash-0731-GGUF/snapshots/109848da2469efe1f1aab9e11acea08a065ccd4f/UD-IQ1_M/DeepSeek-V4-Flash-0731-UD-IQ1_M-00003-of-00003.gguf:/model-00003.gguf:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      OMP_NUM_THREADS: "1"
      VLLM_DSV4_FLASH_MLA_DECODE: "1"
      VLLM_HIER_ALL_REDUCE: "0,1;2,3"
      VLLM_DSV4_WO_A_MARLIN_DIAGONAL: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "64"
      VLLM_SPARSE_DENSE_QUERY_BLOCK: "0"
    entrypoint: ["/opt/venv/bin/vllm"]
    command:
      - "serve"
      - "/runtime-model"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--served-model-name"
      - "deepseek-v4-flash-0731-gguf-tp-iq1-m"
      - "--tensor-parallel-size"
      - "4"
      - "--max-model-len"
      - "148000"
      - "--max-num-seqs"
      - "2"
      - "--max-num-batched-tokens"
      - "256"
      - "--gpu-memory-utilization"
      - "0.98"
      - "--kv-cache-dtype"
      - "fp8_ds_mla"
      - "--load-format"
      - "gguf_dsv4"
      - "--quantization"
      - "gguf_dsv4"
      - "--model-loader-extra-config"
      - '{"tensor_count":1328,"source_quant_types_sha256":"5e5e5dff4787923c3ce592ef0e44aac6729273a59676acc893a79d1d885c4646","gguf_shards":[{"path":"/model-00001.gguf","sha256":"b99fa246a10808146e00a7e908c6852098a4f08394eabf8b37c9263993980a69","file_size":5257664,"tensor_count":0},{"path":"/model-00002.gguf","sha256":"c8536187b0e5dbe71e6bbf6086e0d3b491cd31d60da6522dfef074133c0ee2ee","file_size":49448084864,"tensor_count":756},{"path":"/model-00003.gguf","sha256":"80a4eb4eebc57598d9559c2924054d40d69f51773ae873538939382e120b3e3f","file_size":37447971424,"tensor_count":572}]}'
      - "--disable-custom-all-reduce"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--trust-remote-code"
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
